services:
    nopcommerce_web:
        build: .
        platform: linux/amd64
        container_name: nopcommerce
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - nopcommerce_data:/app/App_Data
        depends_on:
            nopcommerce_database:
                condition: service_started
            rabbitmq:
                condition: service_healthy
        networks:
            - verdemart

    nopcommerce_database:
        image: "mcr.microsoft.com/mssql/server:2019-latest"
        container_name: nopcommerce_mssql_server
        environment:
            SA_PASSWORD: "nopCommerce_db_password"
            ACCEPT_EULA: "Y"
            MSSQL_PID: "Express"
        networks:
            - verdemart

    rabbitmq:
        image: "rabbitmq:3-management"
        container_name: nopcommerce_rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: "guest"
            RABBITMQ_DEFAULT_PASS: "guest"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - verdemart

    erp-stub:
        build: ./services/erp-stub
        container_name: verdemart_erp_stub
        ports:
            - "8001:8001"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
            interval: 10s
            timeout: 5s
            retries: 3
        networks:
            - verdemart

    wms-event-adapter:
        build: ./services/wms-event-adapter
        container_name: verdemart_wms_event_adapter
        ports:
            - "8085:8085"
        environment:
            - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
        depends_on:
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health')"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - verdemart

    wms-stub:
        build: ./services/wms-stub
        container_name: verdemart_wms_stub
        ports:
            - "8002:8002"
        environment:
            - DEFAULT_STOCK=100
            # Routed through the Order Integration Service so stock.updated
            # publishes flow through the same observability surface (/health
            # circuit state + DLQ). The standalone wms-event-adapter remains
            # as a fallback bridge.
            - STOCK_WEBHOOK_URL=http://order-integration-service:8083/webhooks/stock-changed
        depends_on:
            wms-event-adapter:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
            interval: 10s
            timeout: 5s
            retries: 3
        networks:
            - verdemart

    order-integration-service:
        build: ./services/order-integration-service
        container_name: verdemart_order_integration
        ports:
            - "8083:8083"
        environment:
            - ASPNETCORE_ENVIRONMENT=Production
            - RABBITMQ_HOST=rabbitmq
            - RABBITMQ_PORT=5672
            - RABBITMQ_USERNAME=guest
            - RABBITMQ_PASSWORD=guest
            - RABBITMQ_EXCHANGE=verdemart.events
            - ERP_BASE_URL=http://erp-stub:8001
            - WMS_BASE_URL=http://wms-stub:8002
        depends_on:
            rabbitmq:
                condition: service_healthy
            erp-stub:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - verdemart

    dashboard:
        build: ./services/dashboard
        container_name: verdemart_dashboard
        ports:
            - "8090:8090"
        depends_on:
            erp-stub:
                condition: service_healthy
            wms-stub:
                condition: service_healthy
        networks:
            - verdemart

    order-integration-service:
        build: ./services/order-integration-service
        container_name: verdemart_order_integration
        ports:
            - "8083:8083"
        environment:
            - ASPNETCORE_ENVIRONMENT=Production
            - RABBITMQ_HOST=rabbitmq
            - RABBITMQ_PORT=5672
            - RABBITMQ_USERNAME=guest
            - RABBITMQ_PASSWORD=guest
            - RABBITMQ_EXCHANGE=verdemart.events
            - ERP_BASE_URL=http://erp-stub:8001
            - WMS_BASE_URL=http://wms-stub:8002
        depends_on:
            rabbitmq:
                condition: service_healthy
            erp-stub:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - verdemart

    ospos_mysql:
        image: mysql:5.7
        platform: linux/amd64
        container_name: ospos_mysql
        environment:
            MYSQL_ROOT_PASSWORD: ospospass
            MYSQL_DATABASE: ospos
        volumes:
            - ospos_mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pospospass"]
            interval: 5s
            timeout: 3s
            retries: 20
        networks:
            - verdemart
        command: --default-authentication-plugin=mysql_native_password

    # One-shot: builds the OSPOS schema on a fresh DB. The jekkos/opensourcepos
    # image ships no auto-migrator, so a fresh `ospos` DB would otherwise come up
    # empty (HTTP 500 in the UI). `migrate --all` is idempotent — on an already
    # built DB it finds nothing new and exits 0. ospos + ospos_adapter gate on
    # this completing via `service_completed_successfully`.
    ospos_migrate:
        image: jekkos/opensourcepos:latest
        platform: linux/amd64
        container_name: ospos_migrate
        depends_on:
            ospos_mysql:
                condition: service_healthy
        environment:
            CI_ENVIRONMENT: production
            PHP_TIMEZONE: UTC
            MYSQL_HOST_NAME: ospos_mysql
            MYSQL_USERNAME: root
            MYSQL_PASSWORD: ospospass
            MYSQL_DB_NAME: ospos
        volumes:
            - ./services/ospos/ospos.env:/app/.env:ro
        command: ["sh", "-c", "cd /app && until php spark migrate --all; do echo 'waiting for OSPOS DB...'; sleep 3; done"]
        restart: "no"
        networks:
            - verdemart

    ospos:
        image: jekkos/opensourcepos:latest
        platform: linux/amd64
        container_name: ospos
        depends_on:
            ospos_mysql:
                condition: service_healthy
            ospos_migrate:
                condition: service_completed_successfully
        environment:
            CI_ENVIRONMENT: production
            FORCE_HTTPS: "false"
            PHP_TIMEZONE: UTC
            MYSQL_HOST_NAME: ospos_mysql
            MYSQL_USERNAME: root
            MYSQL_PASSWORD: ospospass
            MYSQL_DB_NAME: ospos
        # app.allowedHostnames uses a dotted CI4 var name that docker-compose
        # strips from the environment map, so it's supplied via a bind-mounted
        # .env file instead (OSPOS 3.4 refuses to start without it).
        volumes:
            - ./services/ospos/ospos.env:/app/.env:ro
            # CI4 clean-URL support: image ships no .htaccess and Apache uses
            # AllowOverride None, so /login etc. 404 without this FallbackResource.
            - ./services/ospos/apache-cleanurls.conf:/etc/apache2/conf-enabled/zz-ospos-cleanurls.conf:ro
        ports:
            - "8080:80"
        networks:
            - verdemart

    ospos_adapter:
        build: ./services/ospos-adapter
        container_name: ospos_adapter
        depends_on:
            ospos_mysql:
                condition: service_healthy
            ospos_migrate:
                condition: service_completed_successfully
            rabbitmq:
                condition: service_healthy
        environment:
            OSPOS_DB_HOST: ospos_mysql
            OSPOS_DB_NAME: ospos
            OSPOS_DB_USER: root
            OSPOS_DB_PASSWORD: ospospass
            OSPOS_DB_PORT: 3306
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USERNAME: guest
            RABBITMQ_PASSWORD: guest
            RABBITMQ_EXCHANGE: verdemart.events
            POLLING_INTERVAL_SECONDS: 30
            IDEMPOTENCY_DB_PATH: /app/data/idempotency.db
        volumes:
            - ospos_adapter_data:/app/data
        networks:
            - verdemart

networks:
    verdemart:
        driver: bridge

volumes:
  nopcommerce_data:
  rabbitmq_data:
  ospos_mysql_data:
  ospos_adapter_data:            
