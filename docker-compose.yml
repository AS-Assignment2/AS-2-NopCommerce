services:
    nopcommerce_web:
        build: .
        container_name: nopcommerce
        ports:
            - "80:80"
        volumes:
            - nopcommerce_data:/app/App_Data
        depends_on:
            nopcommerce_database:
                condition: service_started
            rabbitmq:
                condition: service_healthy
        networks:
            - verdemart

    nopcommerce_database:
        image: "mcr.microsoft.com/mssql/server:2019-latest"
        container_name: nopcommerce_mssql_server
        environment:
            SA_PASSWORD: "nopCommerce_db_password"
            ACCEPT_EULA: "Y"
            MSSQL_PID: "Express"
        networks:
            - verdemart

    rabbitmq:
        image: "rabbitmq:3-management"
        container_name: nopcommerce_rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: "guest"
            RABBITMQ_DEFAULT_PASS: "guest"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - verdemart

    erp-stub:
        build: ./services/erp-stub
        container_name: verdemart_erp_stub
        ports:
            - "8001:8001"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
            interval: 10s
            timeout: 5s
            retries: 3
        networks:
            - verdemart

    wms-event-adapter:
        build: ./services/wms-event-adapter
        container_name: verdemart_wms_event_adapter
        ports:
            - "8085:8085"
        environment:
            - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
        depends_on:
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health')"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - verdemart

    wms-stub:
        build: ./services/wms-stub
        container_name: verdemart_wms_stub
        ports:
            - "8002:8002"
        environment:
            - DEFAULT_STOCK=100
            # Points to the standalone WMS Event Adapter.
            # When the Order Integration Service is running, change this to:
            # http://order-integration-service:8080/webhooks/stock-changed
            - STOCK_WEBHOOK_URL=http://wms-event-adapter:8085/webhooks/stock-changed
        depends_on:
            wms-event-adapter:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
            interval: 10s
            timeout: 5s
            retries: 3
        networks:
            - verdemart

    dashboard:
        build: ./services/dashboard
        container_name: verdemart_dashboard
        ports:
            - "8090:8090"
        depends_on:
            erp-stub:
                condition: service_healthy
            wms-stub:
                condition: service_healthy
        networks:
            - verdemart

    ospos_mysql:
        image: mysql:5.7
        container_name: ospos_mysql
        environment:
            MYSQL_ROOT_PASSWORD: ospospass
            MYSQL_DATABASE: ospos
        volumes:
            - ospos_mysql_data:/var/lib/mysql
            # Auto-load the OSPOS schema on a fresh volume so the adapter's
            # tables (ospos_sales, ospos_items, ...) exist on first `up`.
            - ./ospos_minimal_schema.sql:/docker-entrypoint-initdb.d/01-ospos-schema.sql:ro
        networks:
            - verdemart
        command: --default-authentication-plugin=mysql_native_password

    ospos:
        image: jekkos/opensourcepos:latest
        container_name: ospos
        depends_on:
            - ospos_mysql
        environment:
            DB_HOST: ospos_mysql
            DB_NAME: ospos
            DB_USER: root
            DB_PASS: ospospass
        ports:
            - "8080:80"
        networks:
            - verdemart

    ospos_adapter:
        build: ./services/ospos-adapter
        container_name: ospos_adapter
        depends_on:
            - ospos_mysql
            - rabbitmq
        environment:
            OSPOS_DB_HOST: ospos_mysql
            OSPOS_DB_NAME: ospos
            OSPOS_DB_USER: root
            OSPOS_DB_PASSWORD: ospospass
            OSPOS_DB_PORT: 3306
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USERNAME: guest
            RABBITMQ_PASSWORD: guest
            RABBITMQ_EXCHANGE: verdemart.events
            POLLING_INTERVAL_SECONDS: 30
            IDEMPOTENCY_DB_PATH: /app/data/idempotency.db
        volumes:
            - ospos_adapter_data:/app/data
        networks:
            - verdemart

networks:
    verdemart:
        driver: bridge

volumes:
  nopcommerce_data:
  rabbitmq_data:
  ospos_mysql_data:
  ospos_adapter_data:            
