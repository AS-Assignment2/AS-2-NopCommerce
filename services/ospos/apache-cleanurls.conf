# CodeIgniter 4 clean-URL support for OSPOS, bind-mounted into
# /etc/apache2/conf-enabled/ (picked up by `IncludeOptional conf-enabled/*.conf`).
#
# The jekkos/opensourcepos image ships NO public/.htaccess and the global
# Apache config sets `AllowOverride None`, so every clean route (e.g. /login)
# 404s at Apache and only /index.php/login works. FallbackResource sends any
# request that isn't a real file/dir to CI4's front controller — same effect
# as the usual mod_rewrite .htaccess, but no mod_rewrite/.htaccess required.
#
# Must target /var/www/html (the DocumentRoot), NOT /app/public: Apache walks
# the request path as DocumentRoot/... so a <Directory /app/public> block on
# the symlink target never matches.
<Directory /var/www/html>
    Require all granted
    FallbackResource /index.php
</Directory>
